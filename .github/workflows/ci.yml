# Builds and tests Possum on macOS, Windows, the newest releases of the
# three most popular Linux distributions and Android, then runs the real app
# on a (virtual) screen and keeps screenshots and logs as artifacts.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The jobs only read the code. (Uploading artifacts uses the runner's own
# token, not GITHUB_TOKEN.)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Any warning, from the compiler or Clippy, fails the job.
  CARGO_BUILD_WARNINGS: deny

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust targets for a universal app
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets
      - name: Test (Apple Silicon)
        run: cargo test --target aarch64-apple-darwin
      - name: Test (Intel, via Rosetta)
        run: cargo test --target x86_64-apple-darwin
      - name: Build the universal app
        run: |
          ./bundle.sh
          lipo -archs dist/Possum.app/Contents/MacOS/possum
          codesign --verify --deep --strict dist/Possum.app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Run it and take screenshots
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\windows-screenshots.ps1 target\release\possum.exe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows
          path: |
            *.png
            *.log

  linux:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:26.04", name: ubuntu-26.04, family: debian }
          - { image: "ubuntu:26.10", name: ubuntu-26.10, family: debian }
          - { image: "fedora:45", name: fedora-45, family: fedora }
          - { image: "debian:13", name: debian-13, family: debian }
    steps:
      - name: Install packages (Debian, Ubuntu)
        if: matrix.family == 'debian'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc libc6-dev \
            xvfb x11-xserver-utils imagemagick
      - name: Install packages (Fedora)
        if: matrix.family == 'fedora'
        run: |
          dnf install -y --skip-unavailable \
            ca-certificates curl git gcc glibc-devel \
            xorg-x11-server-Xvfb xsetroot ImageMagick
      # rustup alone: the first cargo command installs the Rust (and Clippy)
      # that rust-toolchain.toml names.
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - name: Rust version
        run: rustc --version && cargo --version
      - name: Lint
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Run it on a virtual screen and take screenshots
        run: .github/scripts/linux-screenshots.sh target/release/possum
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            *.png
            *.log

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Android SDK parts and Rust targets
        # The runner has the SDK and JDK 17; these make sure of the parts
        # android/build.sh uses.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" > /dev/null
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Lint
        run: |
          cargo clippy --manifest-path android/Cargo.toml --all-targets
          cargo clippy --manifest-path android/Cargo.toml --lib --target aarch64-linux-android
      - name: Test
        run: cargo test --manifest-path android/Cargo.toml
      - name: Build the APK
        run: ./android/build.sh
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run it on an Android 16 emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/android-screenshots.sh dist/Possum-*-android.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android
          path: |
            *.png
            *.log
