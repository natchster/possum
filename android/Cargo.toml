[package]
name = "possum-android"
version = "1.0.0"
edition = "2024"
# The Rust in ../rust-toolchain.toml, as for the desktop app.
rust-version = "1.100"
publish = false
description = "Possum for Android and Samsung DeX: the shared Rust core, as a library for the Java app."
license-file = "../LICENSE"

# libpossum.so, loaded by the Java app (java/.../Native.java).
[lib]
name = "possum"
path = "src/lib.rs"
crate-type = ["cdylib"]

# Writes the launcher icons at build time (see build.sh); runs on the
# computer doing the build, not on the phone.
[[bin]]
name = "possum-icons"
path = "src/icons.rs"

[lints.clippy]
# Every unsafe block says why it's sound, in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"

[lints.cargo]
unused_dependencies = "warn"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
lto = true
codegen-units = 1
strip = true
