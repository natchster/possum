[package]
name = "possum"
version = "1.0.0"
edition = "2024"
# The Rust in rust-toolchain.toml. (Edition 2024 also means resolver 3, which
# picks dependency versions that build with this Rust.)
rust-version = "1.100"
description = "A screaming pixel-art possum that runs counterclockwise around the edge of your screen."
license-file = "LICENSE"

# CI fails on any warning (CARGO_BUILD_WARNINGS=deny), so these hold there.
[lints.clippy]
# Every unsafe block says why it's sound, in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"

[lints.cargo]
# Each OS's dependencies below are only used on that OS.
unused_dependencies = "warn"

# Each OS only pulls in what it needs.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["shape", "randr", "dpms"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
